<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        .diagram-wrapper {
            position: relative;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            overflow: auto;
        }
        
        .fishbone-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        
        svg {
            max-width: 80vw;
            max-height: 80vh;
            height: auto;
            width: auto;
        }
        
        .export-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .export-btn:hover {
            background: #000;
        }
        
        .text-editor {
            position: absolute;
            background: white;
            border: 2px solid #333;
            border-radius: 2px;
            padding: 2px 4px;
            font-size: 12px;
            font-family: inherit;
            color: #000;
            z-index: 100;
            min-width: 60px;
            max-width: 200px;
        }
        
        .text-editor:focus {
            outline: none;
            border-color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Fishbone Diagram</h1>
        </div>
        
        <div class="diagram-wrapper">
            <div class="fishbone-container">
                <svg id="fishboneSvg" viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <style>
                            .bone-line { stroke: #000; stroke-linecap: round; fill: none; }
                            .bone-label { font-size: 13px; font-weight: 600; fill: #000; }
                            .cause-text { font-size: 11px; fill: #000; cursor: pointer; }
                            .cause-text:hover { text-decoration: underline; }
                            .main-bone-line { stroke-width: 4; }
                            .sub-bone-line { stroke-width: 2; opacity: 0.7; }
                            .category-label-rect { fill: rgba(255,255,255,0.9); stroke: #000; stroke-width: 1; }
                        </style>
                    </defs>
                </svg>
            </div>
            <button class="export-btn" onclick="exportDiagram()">Export PNG</button>
        </div>
    </div>
    
    <script>
        const state = {
            problem: 'Problem',
            people: ['', '', ''],
            methods: ['', '', ''],
            materials: ['', '', ''],
            machines: ['', '', ''],
            measurement: ['', '', ''],
            environment: ['', '', '']
        };
        
        const categories = [
            { key: 'people', label: 'People', position: 0.1, side: 'top' },
            { key: 'methods', label: 'Methods', position: 0.25, side: 'bottom' },
            { key: 'materials', label: 'Materials', position: 0.4, side: 'top' },
            { key: 'machines', label: 'Machines', position: 0.55, side: 'bottom' },
            { key: 'measurement', label: 'Measurement', position: 0.7, side: 'top' },
            { key: 'environment', label: 'Environment', position: 0.85, side: 'bottom' }
        ];
        
        let activeEditorId = null;
        
        function updateCauseText(category, index, value) {
            state[category][index] = value;
            draw();
        }
        
        function updateProblem(value) {
            state.problem = value;
            draw();
        }
        
        function addCauseToCategory(category) {
            state[category].push('');
            draw();
        }
        
        function removeCauseFromCategory(category, index) {
            state[category].splice(index, 1);
            draw();
        }
        
        function makeTextEditable(category, index, textElement, currentValue) {
            if (activeEditorId) return;
            activeEditorId = category + '-' + index;
            
            const bbox = textElement.getBBox();
            const svgRect = document.getElementById('fishboneSvg').getBoundingClientRect();
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'text-editor';
            input.value = currentValue;
            input.style.left = (svgRect.left + bbox.x) + 'px';
            input.style.top = (svgRect.top + bbox.y - 10) + 'px';
            input.style.width = Math.max(60, bbox.width + 10) + 'px';
            
            input.onblur = function() {
                const newValue = input.value.trim();
                if (category === 'problem') {
                    updateProblem(newValue);
                } else {
                    updateCauseText(category, index, newValue);
                }
                document.body.removeChild(input);
                activeEditorId = null;
            };
            
            input.onkeydown = function(e) {
                if (e.key === 'Enter') input.blur();
                if (e.key === 'Escape') {
                    document.body.removeChild(input);
                    activeEditorId = null;
                }
            };
            
            document.body.appendChild(input);
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        }
        
        function draw() {
            const svg = document.getElementById('fishboneSvg');
            const viewBox = svg.getAttribute('viewBox').split(' ');
            const width = parseFloat(viewBox[2]);
            const height = parseFloat(viewBox[3]);
            
            const centerY = height / 2;
            const spineStartX = 80;
            const spineEndX = 1450;
            
            let svgContent = '';
            
            svgContent += '<line x1="' + spineStartX + '" y1="' + centerY + '" x2="' + spineEndX + '" y2="' + centerY + '" class="bone-line main-bone-line"/>';
            
            svgContent += '<polygon points="' + spineStartX + ',' + centerY + ' ' + (spineStartX-40) + ',' + (centerY-25) + ' ' + (spineStartX-40) + ',' + (centerY+25) + '" fill="#000"/>';
            
            svgContent += '<text x="' + (spineStartX - 50) + '" y="' + centerY + '" font-size="13" font-weight="700" text-anchor="end" dominant-baseline="middle" fill="#000" style="cursor: pointer;" onclick="makeTextEditable(\'problem\', 0, this, state.problem)">' + state.problem + '</text>';
            
            categories.forEach(function(cat) {
                const boneX = spineStartX + (spineEndX - spineStartX) * cat.position;
                const isTop = cat.side === 'top';
                const angle = isTop ? -35 : 35;
                const rad = angle * Math.PI / 180;
                const boneLength = 140;
                const endX = boneX + boneLength * Math.cos(rad);
                const endY = centerY + boneLength * Math.sin(rad);
                
                svgContent += '<line x1="' + boneX + '" y1="' + centerY + '" x2="' + endX + '" y2="' + endY + '" class="bone-line main-bone-line"/>';
                
                const labelRad = (angle * Math.PI / 180);
                const labelDist = 70;
                const labelX = boneX + labelDist * Math.cos(labelRad);
                const labelY = centerY + labelDist * Math.sin(labelRad);
                
                svgContent += '<rect x="' + (labelX - 30) + '" y="' + (labelY - 12) + '" width="60" height="24" rx="4" class="category-label-rect"/>';
                svgContent += '<text x="' + labelX + '" y="' + labelY + '" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#000">' + cat.label + '</text>';
                
                const causes = state[cat.key];
                const angleSpan = 50;
                const anglePerCause = causes.length > 1 ? angleSpan / (causes.length - 1) : 0;
                
                causes.forEach(function(cause, idx) {
                    const offset = causes.length > 1 ? (idx - causes.length / 2 + 0.5) * anglePerCause : 0;
                    const subAngle = angle + offset;
                    const subRad = subAngle * Math.PI / 180;
                    const subLength = 70;
                    const subEndX = endX + subLength * Math.cos(subRad);
                    const subEndY = endY + subLength * Math.sin(subRad);
                    
                    svgContent += '<line x1="' + endX + '" y1="' + endY + '" x2="' + subEndX + '" y2="' + subEndY + '" class="bone-line sub-bone-line"/>';
                    
                    const displayText = cause || '(empty)';
                    const textId = 'text-' + cat.key + '-' + idx;
                    svgContent += '<text id="' + textId + '" x="' + subEndX + '" y="' + subEndY + '" class="cause-text" text-anchor="middle" dominant-baseline="middle" onclick="makeTextEditable(\'' + cat.key + '\', ' + idx + ', this, \'' + cause + '\')">' + displayText + '</text>';
                });
            });
            
            svg.innerHTML = svgContent;
            
            categories.forEach(function(cat) {
                const boneX = spineStartX + (spineEndX - spineStartX) * cat.position;
                const isTop = cat.side === 'top';
                const angle = isTop ? -35 : 35;
                const rad = angle * Math.PI / 180;
                const boneLength = 140;
                const endX = boneX + boneLength * Math.cos(rad);
                const endY = centerY + boneLength * Math.sin(rad);
                
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.style.cursor = 'pointer';
                
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', endX);
                circle.setAttribute('cy', endY);
                circle.setAttribute('r', '14');
                circle.setAttribute('fill', '#333');
                circle.setAttribute('opacity', '0');
                circle.style.cursor = 'pointer';
                circle.onclick = function(e) {
                    e.stopPropagation();
                    addCauseToCategory(cat.key);
                };
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', endX);
                text.setAttribute('y', endY);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'middle');
                text.setAttribute('font-size', '16');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('fill', '#333');
                text.setAttribute('opacity', '0');
                text.setAttribute('pointer-events', 'none');
                text.textContent = '+';
                
                circle.onmouseenter = function() {
                    circle.setAttribute('opacity', '0.8');
                    text.setAttribute('opacity', '1');
                };
                
                circle.onmouseleave = function() {
                    circle.setAttribute('opacity', '0');
                    text.setAttribute('opacity', '0');
                };
                
                g.appendChild(circle);
                g.appendChild(text);
                svg.appendChild(g);
            });
        }
        
        function exportDiagram() {
            const svg = document.getElementById('fishboneSvg');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const bbox = svg.getBBox();
            canvas.width = bbox.width + 40;
            canvas.height = bbox.height + 40;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const svgData = new XMLSerializer().serializeToString(svg);
            const img = new Image();
            
            img.onload = function() {
                ctx.drawImage(img, 20, 20);
                
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'fishbone-diagram.png';
                link.click();
            };
            
            img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
        }
        
        draw();
        window.addEventListener('resize', draw);
    </script>
</body>
</html>
