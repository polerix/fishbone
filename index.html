<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishbone Diagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; }
        .wrapper { padding: 40px; max-width: 1600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 32px; margin-bottom: 8px; font-weight: 700; }
        .subtitle { color: #999; font-size: 13px; }
        .diagram-container { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 40px 60px; min-height: 700px; position: relative; }
        svg { display: block; width: 100%; height: auto; background: white; }
        .controls { margin-top: 40px; display: flex; gap: 20px; flex-wrap: wrap; padding: 20px; background: #f5f5f5; border-radius: 6px; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        label { font-size: 13px; font-weight: 600; color: #333; }
        button { padding: 6px 12px; background: #333; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; transition: background 0.2s; }
        button:hover { background: #000; }
        .export { margin-top: 20px; }
        .export button { padding: 10px 20px; font-size: 13px; }
        .item-badge { cursor: pointer; transition: opacity 0.2s; }
        .item-badge:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>Fishbone Diagram</h1>
            <p class="subtitle">Interactive cause-and-effect analysis diagram</p>
        </div>
        
        <div class="diagram-container">
            <svg id="fishbone" viewBox="0 0 2000 700" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label>Ribs:</label>
                <button onclick="addRib()">+ Add</button>
                <button onclick="removeRib()">− Remove</button>
                <span id="ribCount">6</span>
            </div>
            <div class="control-group">
                <label>Items per rib:</label>
                <button onclick="addItemPerRib()">+ More</button>
                <button onclick="removeItemPerRib()">− Fewer</button>
            </div>
            <div class="control-group">
                <label>Problem:</label>
                <input id="problemInput" type="text" value="Problem Definition" style="padding: 6px 10px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; width: 200px;">
            </div>
        </div>
        
        <div class="export">
            <button onclick="exportDiagram()">↓ Export as PNG</button>
        </div>
    </div>
    
    <script>
        const state = {
            problem: 'Problem Definition',
            ribs: [
                { label: 'Materials', items: ['Raw materials', 'Storage', 'Quality', ''] },
                { label: 'People', items: ['Training', 'Experience', 'Awareness', ''] },
                { label: 'Equipment', items: ['Maintenance', 'Calibration', 'Efficiency', ''] },
                { label: 'Processes', items: ['Procedures', 'Documentation', 'Compliance', ''] },
                { label: 'Environment', items: ['Temperature', 'Humidity', 'Safety', ''] },
                { label: 'Testing & Standards', items: ['Methods', 'Accuracy', 'Records', ''] }
            ]
        };
        
        const colors = ['#FF6B9D', '#7B68EE', '#00CED1', '#FFD700', '#FF8C00', '#20B2AA', '#FF69B4', '#1E90FF', '#FF4500', '#32CD32'];
        
        function draw() {
            const svg = document.getElementById('fishbone');
            const w = 2000, h = 700;
            const centerY = h / 2;
            const headX = 1850;
            const tailX = 80;
            
            let html = '';
            
            // Background
            html += `<rect width="${w}" height="${h}" fill="white"/>`;
            
            // Spine (horizontal line)
            html += `<line x1="${tailX}" y1="${centerY}" x2="${headX}" y2="${centerY}" stroke="#333" stroke-width="4" stroke-linecap="round"/>`;
            
            // Tail (left)
            html += `<polygon points="${tailX},${centerY} ${tailX - 50},${centerY - 35} ${tailX - 50},${centerY + 35}" fill="#1a2332" stroke="#000" stroke-width="2"/>`;
            
            // Head (right)
            html += `<polygon points="${headX},${centerY} ${headX + 60},${centerY - 45} ${headX + 60},${centerY + 45}" fill="#1a2332" stroke="#000" stroke-width="2"/>`;
            
            // Problem label
            html += `<g onclick="editProblem()">
                <rect x="${headX + 15}" y="${centerY - 65}" width="120" height="50" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
                <text x="${headX + 75}" y="${centerY - 35}" font-size="14" font-weight="700" text-anchor="middle" fill="#000">${state.problem}</text>
                <style>.problem-label { cursor: pointer; }</style>
            </g>`;
            
            // Ribs
            const ribCount = state.ribs.length;
            const totalSpan = 160; // degrees
            const startAngle = -totalSpan / 2;
            
            state.ribs.forEach((rib, ribIdx) => {
                const angle = startAngle + (ribIdx / (ribCount - 1)) * totalSpan;
                const rad = angle * Math.PI / 180;
                
                // Rib start (on spine)
                const ribStartX = tailX + (headX - tailX) * (0.1 + ribIdx / ribCount * 0.7);
                const ribStartY = centerY;
                
                // Rib end
                const ribLen = 220;
                const ribEndX = ribStartX + ribLen * Math.cos(rad);
                const ribEndY = ribStartY + ribLen * Math.sin(rad);
                
                // Control point for curve
                const cx = ribStartX + ribLen * 0.6 * Math.cos(rad);
                const cy = ribStartY + ribLen * 0.6 * Math.sin(rad);
                
                // Draw curved rib
                html += `<path d="M ${ribStartX} ${ribStartY} Q ${cx} ${cy} ${ribEndX} ${ribEndY}" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>`;
                
                // Category label on spine
                const labelDist = 50;
                const labelRad = rad;
                const labelX = ribStartX + labelDist * Math.cos(labelRad);
                const labelY = ribStartY + labelDist * Math.sin(labelRad) - 15;
                
                html += `<text x="${labelX}" y="${labelY}" font-size="13" font-weight="700" text-anchor="middle" fill="#0066cc">${rib.label}</text>`;
                
                // Sub-items (branches off the rib)
                const itemCount = rib.items.filter(i => i.trim()).length;
                const itemSpread = 50;
                
                rib.items.forEach((item, itemIdx) => {
                    if (!item.trim()) return;
                    
                    const itemOffset = itemSpread * (itemIdx - itemCount / 2 + 0.5) / itemCount;
                    const itemRad = (angle + itemOffset) * Math.PI / 180;
                    
                    // Branch off rib
                    const branchLen = 80;
                    const branchX = ribEndX + branchLen * Math.cos(itemRad);
                    const branchY = ribEndY + branchLen * Math.sin(itemRad);
                    
                    // Branch line
                    html += `<line x1="${ribEndX}" y1="${ribEndY}" x2="${branchX}" y2="${branchY}" stroke="#999" stroke-width="1" opacity="0.6"/>`;
                    
                    // Item badge (colored circle with text)
                    const color = colors[itemIdx % colors.length];
                    const textLen = item.length;
                    const boxW = Math.max(50, textLen * 6 + 16);
                    
                    html += `<g class="item-badge" onclick="editItem(${ribIdx}, ${itemIdx})" style="cursor: pointer;">
                        <circle cx="${branchX}" cy="${branchY}" r="22" fill="${color}" stroke="white" stroke-width="2" opacity="0.85"/>
                        <text x="${branchX}" y="${branchY + 6}" font-size="11" font-weight="600" text-anchor="middle" fill="white" pointer-events="none">${item}</text>
                    </g>`;
                });
            });
            
            svg.innerHTML = html;
        }
        
        function addRib() {
            if (state.ribs.length < 10) {
                state.ribs.push({ label: `Category ${state.ribs.length + 1}`, items: ['Item 1', 'Item 2', ''] });
                document.getElementById('ribCount').textContent = state.ribs.length;
                draw();
            }
        }
        
        function removeRib() {
            if (state.ribs.length > 1) {
                state.ribs.pop();
                document.getElementById('ribCount').textContent = state.ribs.length;
                draw();
            }
        }
        
        function addItemPerRib() {
            state.ribs.forEach(rib => {
                if (rib.items.length < 6) rib.items.push('');
            });
            draw();
        }
        
        function removeItemPerRib() {
            state.ribs.forEach(rib => {
                if (rib.items.length > 1) rib.items.pop();
            });
            draw();
        }
        
        function editProblem() {
            const val = prompt('Enter problem:', state.problem);
            if (val !== null) {
                state.problem = val || 'Problem';
                document.getElementById('problemInput').value = state.problem;
                draw();
            }
        }
        
        function editItem(ribIdx, itemIdx) {
            const val = prompt('Enter item:', state.ribs[ribIdx].items[itemIdx]);
            if (val !== null) {
                state.ribs[ribIdx].items[itemIdx] = val;
                draw();
            }
        }
        
        function exportDiagram() {
            const svg = document.getElementById('fishbone');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 2000;
            canvas.height = 700;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'fishbone.png';
                a.click();
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(new XMLSerializer().serializeToString(svg));
        }
        
        document.getElementById('problemInput').addEventListener('change', (e) => {
            state.problem = e.target.value || 'Problem';
            draw();
        });
        
        draw();
    </script>
</body>
</html>
